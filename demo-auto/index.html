<style>
#ln{--paper:#f6f4ee;--ink:#263238;--muted:#6b7a80;--line:#d8d2c4;
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--paper);display:block;min-height:100vh;padding-bottom:48px}
#ln *,#ln *::before,#ln *::after{box-sizing:border-box}
#ln button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#ln .ln-top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--line);
  padding:12px 22px 0;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
#ln .ln-brand h1{margin:0;font-size:19px;letter-spacing:.4px;text-transform:uppercase;color:#1b5e20}
#ln .ln-brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
#ln .ln-searchbox{position:relative;flex:1 1 240px;max-width:420px}
#ln #ln-q{width:100%;padding:8px 12px;border:2px solid #b9b2a2;border-radius:999px;background:#fff;font:inherit;font-size:14px}
#ln #ln-q:focus{outline:none;border-color:#1b5e20}
#ln .ln-qres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:2px solid #b9b2a2;
  border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.14);overflow:hidden;max-height:320px;overflow-y:auto;z-index:40}
#ln .ln-qres button{display:block;width:100%;text-align:left;padding:8px 12px;border-bottom:1px solid #eee}
#ln .ln-qres button:last-child{border-bottom:0}
#ln .ln-qres button:hover{background:#f1efe7}
#ln .ln-qres b{display:block;font-size:13.5px}
#ln .ln-qres span{font-size:12px;color:var(--muted)}
#ln .ln-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
#ln .ln-tabs button{padding:8px 14px;border-radius:10px 10px 0 0;font-weight:600;font-size:13.5px;color:var(--muted);
  border:2px solid transparent;border-bottom:0}
#ln .ln-tabs button[aria-selected="true"]{color:#1b5e20;background:#fff;border-color:var(--line)}
#ln main{padding:22px 22px 0;max-width:1500px;margin:0 auto}
#ln .ln-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:15px;letter-spacing:.6px;
  text-transform:uppercase;color:#bf5b16}
#ln .ln-h::after{content:"";flex:1;border-top:2px dashed #c9b79a}
#ln .ln-h.red{color:#b3403f}
#ln .ln-h.red::after{border-top-color:#d8a3a2}
#ln .ln-h.green{color:#2e7d32}
#ln .ln-h.green::after{border-top-color:#a8c8a8}
#ln .ln-lead{margin:4px 0 14px;font-size:14px;color:var(--muted)}
#ln .chip{display:inline-block;padding:2px 9px;border:1.5px solid #9aa4a8;border-radius:999px;background:#fff;
  font-size:11.5px;color:#455a64;white-space:nowrap}
#ln .chip.hl{background:#fff3bf;border-color:#e0c341;color:#7a5c00;font-weight:600}
#ln .chip.thay{background:#fff;border-color:#b3403f;color:#b3403f;font-weight:700;letter-spacing:.5px}
#ln .chip.old{background:#efece4;border-color:#a49c8a;color:#6d6553;text-decoration:line-through}
#ln .card{background:#fff;border:2px solid var(--c,#90a4ae);border-radius:12px;padding:14px 16px;
  box-shadow:3px 4px 0 rgba(0,0,0,.06)}
#ln .card.tint{background:var(--cbg,#fff)}
#ln .law h2{margin:0 0 8px;font-size:20px;color:#1565c0;letter-spacing:.3px}
#ln .law .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#ln .chaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#ln .chap{background:#fff;border:1.5px solid #90a4ae;border-radius:9px;padding:8px 10px;text-align:left;width:100%}
#ln .chap:hover{border-color:#1565c0;box-shadow:2px 2px 0 rgba(21,101,192,.25)}
#ln .chap b{display:block;font-size:13px;color:#1565c0}
#ln .chap span{display:block;font-size:12px;color:var(--ink);margin:2px 0 4px}
#ln .chap .chip{font-size:10.5px;padding:1px 7px;background:#fdeccc;border-color:#e0a96d;color:#8a4b00}
#ln .grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
#ln .grp header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#ln .grp h4{margin:0;font-size:17px;color:var(--c)}
#ln .grp .gsubj{font-size:12.5px;color:var(--muted)}
#ln .grp .gmeta{font-size:12px;color:var(--muted);margin:2px 0 6px}
#ln .grp .thay{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:4px 0 6px;flex-wrap:wrap}
#ln .gbul{margin:4px 0 8px;padding-left:18px;font-size:13px}
#ln .gbul li{margin:2px 0}
#ln .gbul li mark{background:#fff3bf;padding:0 2px}
#ln .kids{display:grid;gap:6px}
#ln .kid{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--c);border-radius:9px;
  padding:7px 10px}
#ln .kid:hover{box-shadow:2px 2px 0 rgba(0,0,0,.15)}
#ln .kid b{font-size:13px;color:var(--c)}
#ln .kid i{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px}
#ln .kid span{display:block;font-size:12px;color:var(--ink)}
#ln .kid mark{background:#fff3bf;padding:0 2px}
#ln .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
#ln .rel{cursor:pointer;text-align:left;width:100%}
#ln .rel:hover{box-shadow:3px 4px 0 rgba(0,0,0,.18)}
#ln .rel header{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#ln .rel b{font-size:14.5px;color:var(--c)}
#ln .rel p{margin:6px 0 0;font-size:12.5px}
#ln .rel p mark{background:#fff3bf;padding:0 2px}
#ln .lookup{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:2px dashed #c9b79a;
  border-radius:12px;padding:12px 14px;margin-bottom:16px}
#ln .lookup label{font-size:13.5px;font-weight:600}
#ln .lookup select{font:inherit;font-size:14px;padding:7px 10px;border:2px solid #b9b2a2;border-radius:9px;background:#fff}
#ln .pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
#ln .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:#fff;
  border:2px solid var(--line);border-radius:12px;padding:12px}
#ln .pair .pold,#ln .pair .pnew{border-radius:9px;padding:8px 10px;border:1.5px solid #a49c8a;background:#f4f1e9}
#ln .pair .pnew{border-color:var(--c);background:var(--cbg);cursor:pointer;text-align:left;width:100%}
#ln .pair .pnew:hover{box-shadow:2px 2px 0 rgba(0,0,0,.15)}
#ln .pair b{display:block;font-size:13.5px}
#ln .pair .pold b{color:#6d6553;text-decoration:line-through}
#ln .pair .pnew b{color:var(--c)}
#ln .pair span{display:block;font-size:11.5px;color:var(--muted)}
#ln .pair .parrow{font-size:20px;font-weight:700;color:#b3403f}
#ln .pair .pnote{grid-column:1/-1;margin:2px 0 0;font-size:11.5px;color:var(--muted)}
#ln .tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
#ln .tbtn{background:#fff;border:2px solid #b9b2a2;border-radius:11px;padding:10px 12px;text-align:left;
  font-size:13.5px;font-weight:600}
#ln .tbtn:hover{border-color:#1b5e20}
#ln .tbtn[aria-pressed="true"]{border-color:#1b5e20;background:#eaf3ea;box-shadow:2px 3px 0 rgba(27,94,32,.25)}
#ln .tbtn span{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
#ln .tres{margin-top:16px;display:grid;gap:8px}
#ln .trow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:#fff;
  border:2px solid var(--c,#90a4ae);border-left-width:8px;border-radius:11px;padding:10px 14px}
#ln .trow .n{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:14px}
#ln .trow b{font-size:14.5px;color:var(--c)}
#ln .trow p{margin:2px 0 0;font-size:12.5px;color:var(--ink)}
#ln .trow .open{border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
#ln .trow .open:hover{background:var(--cbg)}
#ln .twhy{background:#fff3bf;border:1.5px solid #e0c341;border-radius:11px;padding:10px 14px;font-size:13px;margin-bottom:4px}
#ln .tl{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px}
#ln .tlstep{flex:0 0 230px;background:var(--cbg,#fff);border:2px solid var(--c,#90a4ae);border-radius:11px;
  padding:10px 12px;position:relative}
#ln .tlstep b{display:block;font-size:14px;color:var(--c)}
#ln .tlstep span{display:block;font-size:12.5px;margin-top:3px}
#ln .tlstep:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:42%;font-size:18px;font-weight:700;color:#8a8371}
#ln .rp{display:grid;gap:10px;max-width:900px}
#ln .rpstep{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;background:var(--cbg,#fff);
  border:2px solid var(--c,#90a4ae);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;width:100%}
#ln .rpstep:hover{box-shadow:3px 4px 0 rgba(0,0,0,.15)}
#ln .rpstep .n{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:16px}
#ln .rpstep b{font-size:15.5px;color:var(--c)}
#ln .rpstep span{display:block;font-size:13px;margin-top:2px}
#ln .quote{margin:22px auto 0;max-width:760px;text-align:center;font-size:16px;font-style:italic;color:#1b5e20;
  border-top:2px dashed #a8c8a8;padding-top:16px}
#ln .ln-foot{max-width:1500px;margin:30px auto 0;padding:0 22px;font-size:11.5px;color:var(--muted)}
#ln .ln-drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:50;
  border-left:3px solid #1b5e20;box-shadow:-12px 0 30px rgba(0,0,0,.2);overflow-y:auto;padding:18px 20px 40px}
#ln .ln-x{position:sticky;top:0;float:right;margin-left:8px;width:32px;height:32px;border-radius:50%;
  background:#f1efe7;font-size:18px;line-height:1;border:1.5px solid #b9b2a2}
#ln .ln-x:hover{background:#e4e0d4}
#ln .d-code{font-size:20px;font-weight:700;color:var(--c,#263238);margin:4px 0 2px;padding-right:36px}
#ln .d-type{font-size:12px;color:var(--muted);margin-bottom:10px}
#ln .d-sec{margin:14px 0 0;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#8a8371}
#ln .d-body{font-size:13.5px;margin:6px 0 0}
#ln .d-body ul{margin:6px 0;padding-left:18px}
#ln .d-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#ln .d-links button{border:1.5px solid var(--c,#607d8b);color:var(--c,#455a64);border-radius:999px;
  padding:3px 11px;font-size:12px;font-weight:600;background:var(--cbg,#fff)}
#ln .d-links button:hover{box-shadow:1px 2px 0 rgba(0,0,0,.2)}
#ln .d-links button.oldlink{text-decoration:line-through;color:#6d6553;border-color:#a49c8a;background:#f4f1e9}
@media (max-width:860px){
  #ln .ln-top{padding:10px 12px 0}
  #ln main{padding:16px 12px 0}
  #ln .ln-tabs{margin-left:0}
  #ln .pair{grid-template-columns:1fr}

var VIEWS=[["map","Bản đồ"],["old","Cũ → Mới"],["task","Theo việc"],["time","Thời gian"],["path","Lộ trình"]].filter(function(v){
  if(v[0]==="old")return DATA.pairs.length||Object.keys(DATA.docs).some(function(k){return DATA.docs[k].old;});
  if(v[0]==="task")return (DATA.tasks||[]).length;
  if(v[0]==="time")return (DATA.timeline||[]).length;
  if(v[0]==="path")return (DATA.readingPath||[]).length;
  return true;});

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch];});}
function D(id){return DATA.docs[id];}
function G(id){var d=D(id);return (d&&DATA.groups[d.g])||DATA.groups.lq||{c:"#546e7a",bg:"#eceff1"};}
function st(id){var g=G(id);return "--c:"+g.c+";--cbg:"+g.bg;}
function gst(g){var x=DATA.groups[g]||DATA.groups.lq||{c:"#546e7a",bg:"#eceff1"};return "--c:"+x.c+";--cbg:"+x.bg;}
function code(id){return esc(D(id)?D(id).code:id);}

document.getElementById("ln-src").textContent=DATA.meta.src;

tabsEl.innerHTML=VIEWS.map(function(v){

}).join("");
tabsEl.addEventListener("click",function(e){
  var b=e.target.closest("button[data-view]");
  if(!b)return;
  state.view=b.dataset.view;
  tabsEl.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-selected",x===b);});
  render();
});

function chipRow(list){return '<div class="chips">'+list.map(function(c){
  return '<span class="chip'+(/Hiệu lực/.test(c)?" hl":"")+'">'+esc(c)+"</span>";}).join("")+"</div>";}

function kidHtml(id){var d=D(id);
  return '<button class="kid" data-doc="'+id+'" style="'+st(id)+'"><b>'+code(id)+"</b><i>"+esc(d.issued||"")+"</i><span>"+
    (d.hl?"<mark>":"")+esc(d.sum)+(d.hl?"</mark>":"")+"</span></button>";}

function grpCard(id){var d=D(id);
  var kids=Object.keys(DATA.docs).filter(function(k){var x=D(k);return x.g===d.g&&k!==id&&!x.old&&x.type!=="Luật";});
  var thay=(d.replaces||[]).map(function(r){return '<span class="chip thay">THAY</span> <span class="chip old">'+code(r)+"</span>";}).join(" ");
  return '<article class="card tint grp" style="'+st(id)+'">'+
    "<header><h4>"+code(id)+'</h4><span class="gsubj">'+esc(G(id).label)+"</span></header>"+
    '<div class="gmeta">'+esc(d.issued||"")+" · hiệu lực "+esc(d.eff||"01/7/2026")+"</div>"+
    (thay?'<div class="thay">'+thay+"</div>":"")+
    (d.bullets?'<ul class="gbul">'+d.bullets.map(function(b){return "<li>"+esc(b).replace(/TT 32\/2026\/TT-BXD|VBHN 91\/2026/,"<mark>$&</mark>")+"</li>";}).join("")+"</ul>":"")+
    (kids.length?'<div class="kids">'+kids.map(kidHtml).join("")+"</div>":"")+
    "</article>";}

function relCard(id){var d=D(id);
  return '<button class="card rel" data-doc="'+id+'" style="'+st(id)+'">'+
    "<header><b>"+code(id)+'</b><span class="chip">'+esc(d.eff||d.issued)+"</span></header>"+
    "<p>"+esc(d.sum).replace(/NĐ 16\/2022/,"<mark>$&</mark>")+"</p></button>";}

function viewMap(){
  var ids=Object.keys(DATA.docs);
  var lawId=ids.filter(function(k){var d=D(k);return d.type==="Luật"&&!d.old;})[0];
  var six=ids.filter(function(k){var d=D(k);return !d.old&&d.g===k&&d.type==="Nghị định";});
  var rel=ids.filter(function(k){var d=D(k);return !d.old&&(d.g==="lq"||d.g==="xuphat");});
  var h="";
  if(lawId){var l=D(lawId);
    var chips=l.chips||[].concat(l.issued?["Ban hành "+l.issued]:[],l.eff?["Hiệu lực "+l.eff]:[]);
    h+='<section class="card tint law" style="'+st(lawId)+'"><h2>'+code(lawId)+"</h2>"+
      (chips.length?chipRow(chips):"")+
      (l.chapters?'<div class="chaps">'+l.chapters.map(function(c){
        return '<button class="chap" data-doc="'+lawId+'"><b>'+esc(c.t)+"</b><span>"+esc(c.d)+"</span>"+
          (c.nd?'<span class="chip">'+esc(c.nd)+"</span>":"")+"</button>";}).join("")+"</div>":"")+
      "</section>";}
  if(six.length){
    var effs=six.map(function(k){return D(k).eff;});
    var common=effs.length&&effs.every(function(e){return e&&e===effs[0];})?effs[0]:"";
    h+='<h3 class="ln-h">Nghị định hướng dẫn <span class="chip">'+(common?"đều hiệu lực "+esc(common):"bấm thẻ để xem chi tiết")+"</span></h3>"+
      '<div class="grid6">'+six.map(grpCard).join("")+"</div>";}
  if(rel.length)h+='<h3 class="ln-h red">Văn bản liên quan</h3><div class="grid4">'+rel.map(relCard).join("")+"</div>";
  return h||'<p class="ln-lead">Không có dữ liệu văn bản nào.</p>';}

function pairHtml(p,big){var o=D(p.old),n=D(p.nw);
  return '<div class="pair" style="'+st(p.nw)+'">'+
    '<div class="pold"><b>'+code(p.old)+"</b><span>"+esc(o.sum)+"</span></div>"+
    '<div class="parrow">→</div>'+
    '<button class="pnew" data-doc="'+p.nw+'"><b>'+code(p.nw)+"</b><span>"+esc(n.sum)+"</span></button>"+
    (p.note?'<p class="pnote">'+esc(p.note)+"</p>":"")+
    "</div>";}

function viewOld(){
  var ps=DATA.pairs.filter(function(p){return D(p.old)&&D(p.nw);});
  var opts=ps.map(function(p){return '<option value="'+p.old+'">'+code(p.old)+" — "+esc(D(p.old).sum)+"</option>";}).join("");
  return '<p class="ln-lead">Hồ sơ, biểu mẫu, quy trình còn dẫn chiếu văn bản cũ thì rà theo cặp thay thế. Chọn văn bản cũ trong hồ sơ của bạn:</p>'+
    '<div class="lookup"><label for="ln-oldsel">Đang dẫn chiếu:</label><select id="ln-oldsel"><option value="">— chọn văn bản cũ —</option>'+opts+"</select></div>"+
    '<div id="ln-oldres"></div>'+
    '<h3 class="ln-h red">Toàn bộ cặp thay thế</h3>'+
    '<div class="pairs">'+ps.map(function(p){return pairHtml(p);}).join("")+"</div>";}

function viewTask(){
  return '<p class="ln-lead">Chọn việc bạn đang làm — hệ thống chỉ ra văn bản cần mở, theo thứ tự ưu tiên.</p>'+
    '<div class="tgrid">'+DATA.tasks.map(function(t){
      return '<button class="tbtn" data-task="'+t.id+'" aria-pressed="'+(state.task===t.id)+'">'+esc(t.label)+"<span>"+esc(t.hint)+"</span></button>";}).join("")+"</div>"+
    '<div class="tres" id="ln-tres"></div>';}

function taskResult(id){
  var t=DATA.tasks.filter(function(x){return x.id===id;})[0];
  if(!t)return "";
  return '<div class="twhy">Việc: <b>'+esc(t.label)+"</b> — mở theo thứ tự sau:</div>"+
    t.docs.filter(function(p){return D(p[0]);}).map(function(pair,i){
      return '<div class="trow" style="'+st(pair[0])+'"><div class="n">'+(i+1)+"</div>"+
        '<div><b>'+code(pair[0])+"</b><p>"+esc(pair[1])+"</p></div>"+
        '<button class="open" data-doc="'+pair[0]+'">chi tiết</button></div>';}).join("");}

function viewTime(){
  return '<p class="ln-lead">Mốc thời gian chuyển hệ: từ ngày thông qua đến bản hợp nhất cuối cùng.</p>'+
    '<div class="tl">'+DATA.timeline.filter(function(s){return DATA.groups[s.g];}).map(function(s){
      return '<div class="tlstep" style="'+gst(s.g)+'"><b>'+esc(s.d)+"</b><span>"+esc(s.t)+"</span></div>";}).join("")+"</div>";}

function viewPath(){
  return '<p class="ln-lead">Thứ tự nên đọc cho kỹ sư QAQC, TVGS (góc nhìn người biên soạn). Bấm từng bước để mở chi tiết.</p>'+
    '<div class="rp">'+DATA.readingPath.filter(function(s){return D(s.doc);}).map(function(s,i){var d=D(s.doc);
      return '<button class="rpstep" data-doc="'+s.doc+'" style="'+st(s.doc)+'"><div class="n">'+(i+1)+"</div>"+
        '<div><b>'+code(s.doc)+"</b><span>"+esc(s.why)+"</span></div></button>";}).join("")+"</div>"+
    '<p class="quote">'+esc(DATA.quote)+"</p>";}

function render(){
  qres.hidden=true;
  main.innerHTML={map:viewMap,old:viewOld,task:viewTask,time:viewTime,path:viewPath}[state.view]();
  if(state.view==="old"){
    document.getElementById("ln-oldsel").addEventListener("change",function(){
      var box=document.getElementById("ln-oldres");
      if(!this.value){box.innerHTML="";return;}
      var p=DATA.pairs.filter(function(x){return x.old===this.value&&D(x.old)&&D(x.nw);},this)[0];
      box.innerHTML='<h3 class="ln-h green">Mở bản mới thay thế</h3><div class="pairs">'+pairHtml(p)+"</div>";
    });
  }
  if(state.view==="task"&&state.task){
    document.getElementById("ln-tres").innerHTML=taskResult(state.task);
  }
}

function openDoc(id){
  var d=D(id);if(!d)return;
  var g=G(id);
  var h='<div class="d-code" style="'+st(id)+'">'+code(id)+"</div>"+
    '<div class="d-type">'+esc(d.type)+" · nhóm: "+esc(g.label||"—")+(d.old?" · <b>hết hiệu lực</b>":"")+"</div>";
  h+='<p class="d-sec">Nội dung</p><p class="d-body">'+esc(d.sum)+"</p>";
  if(d.bullets)h+='<ul class="d-body">'+d.bullets.map(function(b){return "<li>"+esc(b)+"</li>";}).join("")+"</ul>";
  if(d.chips)h+='<p class="d-sec">Mốc</p><div class="d-links">'+d.chips.map(function(c){return '<span class="chip">'+esc(c)+"</span>";}).join("")+"</div>";
  if(d.issued)h+='<p class="d-sec">Ban hành</p><p class="d-body">'+esc(d.issued)+"</p>";
  if(d.eff)h+='<p class="d-sec">Hiệu lực</p><p class="d-body">'+esc(d.eff)+"</p>";
  if(d.replaces&&d.replaces.length){
    h+='<p class="d-sec">Thay thế</p><div class="d-links">'+d.replaces.filter(function(r){return D(r);}).map(function(r){
      return '<button class="oldlink" data-doc="'+r+'">'+code(r)+"</button>";}).join("")+"</div>";}
  if(d.replacedBy&&d.replacedBy.length){
    h+='<p class="d-sec">Được thay bởi</p><div class="d-links">'+d.replacedBy.filter(function(r){return D(r);}).map(function(r){
      return '<button data-doc="'+r+'" style="'+st(r)+'">'+code(r)+"</button>";}).join("")+"</div>";}
  var kids=Object.keys(DATA.docs).filter(function(k){var x=D(k);return x.g===d.g&&k!==id&&!x.old&&x.type!=="Luật"&&d.type==="Nghị định";});
  if(kids.length)h+='<p class="d-sec">Văn bản đi kèm</p><div class="d-links">'+kids.map(function(k){
    return '<button data-doc="'+k+'" style="'+st(k)+'">'+code(k)+"</button>";}).join("")+"</div>";
  var inTasks=DATA.tasks.filter(function(t){return t.docs.some(function(p){return p[0]===id;});});
  if(inTasks.length)h+='<p class="d-sec">Dùng cho việc</p><div class="d-links">'+inTasks.map(function(t){
    return '<button data-gotask="'+t.id+'">'+esc(t.label)+"</button>";}).join("")+"</div>";
  var rp=DATA.readingPath.findIndex(function(s){return s.doc===id;});
  if(rp>=0)h+='<p class="d-sec">Lộ trình đọc</p><p class="d-body">Bước '+(rp+1)+" / 5 — "+esc(DATA.readingPath[rp].why)+"</p>";
  dbody.innerHTML=h;
  drawer.hidden=false;
}
function closeDrawer(){drawer.hidden=true;}
document.getElementById("ln-x").addEventListener("click",closeDrawer);

root.addEventListener("click",function(e){
  var doc=e.target.closest("[data-doc]");
  if(doc){openDoc(doc.dataset.doc);return;}
  var t=e.target.closest("[data-task]");
  if(t){state.task=t.dataset.task;
    main.querySelectorAll(".tbtn").forEach(function(b){b.setAttribute("aria-pressed",b===t);});
    document.getElementById("ln-tres").innerHTML=taskResult(state.task);
    return;}
  var gt=e.target.closest("[data-gotask]");
  if(gt){state.view="task";state.task=gt.dataset.gotask;
    tabsEl.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-selected",x.dataset.view==="task");});
    render();closeDrawer();return;}
  if(!e.target.closest(".ln-drawer")&&!e.target.closest(".ln-searchbox"))closeDrawer();
});

function searchList(term){
  term=term.trim().toLowerCase();
  if(term.length<2)return [];
  return Object.keys(DATA.docs).filter(function(id){var d=D(id);
    return (d.code+" "+d.sum+" "+(d.kw||"")).toLowerCase().indexOf(term)>=0;
  }).slice(0,9);
}
q.addEventListener("input",function(){
  var list=searchList(q.value);
  if(!list.length){qres.hidden=true;return;}
  qres.hidden=false;
  qres.innerHTML=list.map(function(id){var d=D(id);
    return '<button data-doc="'+id+'"><b>'+code(id)+(d.old?" (hết hiệu lực)":"")+"</b><span>"+esc(d.sum)+"</span></button>";}).join("");
});
q.addEventListener("keydown",function(e){
  if(e.key==="Enter"){var list=searchList(q.value);if(list.length){openDoc(list[0]);qres.hidden=true;}}
  if(e.key==="Escape"){qres.hidden=true;q.blur();}
});
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==="Escape")closeDrawer();
});

render();
})();
