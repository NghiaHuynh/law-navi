<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var cs=localStorage.getItem("ln-color-scheme")||new URLSearchParams(location.search).get("theme");if(cs==="light"||cs==="dark")document.querySelector('meta[name="color-scheme"]').content=cs;}catch(e){}</script>
<title>Bản đồ văn bản xây dựng từ 01/7/2026</title>
</head>
<body>
<!--FRAGMENT-START-->
<section class="wrap" id="ln">
  <header class="ln-top">
    <div class="ln-brand">
      <h1 id="ln-h1">Bản đồ văn bản pháp luật</h1>
      <p id="ln-sub"></p>
    </div>
    <div class="ln-searchbox">
      <input id="ln-q" type="search" placeholder="Tìm số văn bản, từ khóa, việc cần làm…  ( / )" autocomplete="off" aria-label="Tìm kiếm văn bản">
      <div id="ln-qres" class="ln-qres" hidden></div>
    </div>
    <div class="ln-tools">
      <div class="ln-persona" id="ln-persona" role="group" aria-label="Bạn là ai?"></div>
      <button class="ln-toolbtn" id="ln-pathbtn" title="Tìm đường liên hệ giữa hai văn bản">⇄ Liên hệ</button>
      <button class="ln-toolbtn" id="ln-helpbtn" title="Phím tắt (phím ?)">⌨</button>
      <button class="ln-toolbtn" id="ln-theme" title="Đổi nền sáng/tối"></button>
    </div>
    <nav class="ln-tabs" id="ln-tabs" aria-label="Chế độ xem"></nav>
  </header>
  <main id="ln-main"></main>
  <footer class="ln-foot">
    <p id="ln-src"></p>
    <p id="ln-sources" class="ln-sources"></p>
  </footer>
  <aside class="ln-drawer" id="ln-drawer" hidden aria-label="Chi tiết văn bản">
    <button class="ln-x" id="ln-x" aria-label="Đóng khung chi tiết">&times;</button>
    <div id="ln-dbody"></div>
  </aside>
  <div class="ln-modal" id="ln-pathmodal" hidden>
    <div class="ln-dialog" role="dialog" aria-label="Tìm đường liên hệ">
      <header><h3>⇄ Tìm đường liên hệ</h3><button class="ln-x" data-closemodal aria-label="Đóng">&times;</button></header>
      <p class="ln-lead">Chọn hai văn bản bất kỳ — hệ thống lần theo quan hệ căn cứ, thay thế, sửa đổi và nhóm hướng dẫn để chỉ ra chuỗi nối ngắn nhất giữa chúng.</p>
      <div class="ln-pathpick">
        <label>Từ văn bản<select id="ln-pfrom"></select></label>
        <label>Đến văn bản<select id="ln-pto"></select></label>
        <button class="askgo" id="ln-pgo">Tìm đường</button>
      </div>
      <div id="ln-pres"></div>
    </div>
  </div>
  <div class="ln-modal" id="ln-helpmodal" hidden>
    <div class="ln-dialog" role="dialog" aria-label="Phím tắt">
      <header><h3>⌨ Phím tắt</h3><button class="ln-x" data-closemodal aria-label="Đóng">&times;</button></header>
      <ul class="ln-keys" id="ln-keys"></ul>
    </div>
  </div>
</section>
<style>
/* ============================================================
   DESIGN TOKENS — "Ink & Rail": chrome trung tính, màu nhóm văn
   bản là màu duy nhất mang nghĩa.
   Cấu trúc: giá trị thô light/dark -> token dự phòng theo
   prefers-color-scheme -> light-dark() theo color-scheme (đi theo
   <meta name="color-scheme"> nên nút đổi nền tối không cần class).
   ============================================================ */
:root{color-scheme:light dark}
:root:has(> head > meta[name="color-scheme"][content="dark"]){color-scheme:dark}
:root:has(> head > meta[name="color-scheme"][content="light"]){color-scheme:light}
#ln{
  /* giá trị thô */
  --paper-l:#f6f7f6;--paper-d:#0e1213;
  --surface-l:#fff;--surface-d:#161b1c;
  --surface2-l:#fafbfa;--surface2-d:#1b2123;
  --ink-l:#131a1c;--ink-d:#e9edea;
  --muted-l:#5b6a6f;--muted-d:#9dabb0;
  --line-l:#e4e7e4;--line-d:#272e30;
  /* viền của control tương tác phải đạt ~3:1 với nền (WCAG 1.4.11) */
  --linestrong-l:#7d8a85;--linestrong-d:#66736f;
  --accent-l:#0f6b46;--accent-d:#5cc79a;
  --accentink-l:#0b5335;--accentink-d:#8fdcb8;
  --red-l:#c0392b;--red-d:#e0776d;
  --amber-l:#8a5b04;--amber-d:#d9a441;
  --blue-l:#1257a6;--blue-d:#7fb2e8;
  /* token dùng trong bài viết */
  --paper:var(--paper-l);--surface:var(--surface-l);--surface-2:var(--surface2-l);
  --ink:var(--ink-l);--muted:var(--muted-l);--line:var(--line-l);--line-strong:var(--linestrong-l);
  --accent:var(--accent-l);--accent-ink:var(--accentink-l);
  --red:var(--red-l);--amber:var(--amber-l);--blue:var(--blue-l);
  --r1:10px;--r2:14px;--r3:20px;
  --sh1:0 1px 2px rgba(14,24,20,.05);
  --sh2:0 1px 2px rgba(14,24,20,.05),0 10px 22px -14px rgba(14,24,20,.22);
  --sh3:0 2px 8px rgba(14,24,20,.10),0 28px 64px -28px rgba(14,24,20,.36);
  --ease:cubic-bezier(.22,.8,.24,1);
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* không khai báo color-scheme ở đây: #ln phải kế thừa giá trị đã ghim từ :root để light-dark() nghe theo <meta> */
  accent-color:var(--accent);
  scrollbar-color:var(--line-strong) transparent;
  font:14.5px/1.6 var(--f-ui);color:var(--ink);background:var(--paper);display:block;
  min-height:100vh;padding-bottom:56px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* Dự phòng cho trình duyệt chưa có light-dark(): vẫn theo hệ điều hành. */
@media (prefers-color-scheme:dark){
  #ln{--paper:var(--paper-d);--surface:var(--surface-d);--surface-2:var(--surface2-d);
    --ink:var(--ink-d);--muted:var(--muted-d);--line:var(--line-d);--line-strong:var(--linestrong-d);
    --accent:var(--accent-d);--accent-ink:var(--accentink-d);
    --red:var(--red-d);--amber:var(--amber-d);--blue:var(--blue-d)}}
/* Bản hiện đại: một bộ token tự theo color-scheme (kể cả khi bị ghim bởi <meta>). */
@supports (color:light-dark(#fff,#000)){
  #ln{--paper:light-dark(var(--paper-l),var(--paper-d));
    --surface:light-dark(var(--surface-l),var(--surface-d));
    --surface-2:light-dark(var(--surface2-l),var(--surface2-d));
    --ink:light-dark(var(--ink-l),var(--ink-d));
    --muted:light-dark(var(--muted-l),var(--muted-d));
    --line:light-dark(var(--line-l),var(--line-d));
    --line-strong:light-dark(var(--linestrong-l),var(--linestrong-d));
    --accent:light-dark(var(--accent-l),var(--accent-d));
    --accent-ink:light-dark(var(--accentink-l),var(--accentink-d));
    --red:light-dark(var(--red-l),var(--red-d));
    --amber:light-dark(var(--amber-l),var(--amber-d));
    --blue:light-dark(var(--blue-l),var(--blue-d));
    accent-color:light-dark(var(--accent-l),var(--accent-d));
    scrollbar-color:light-dark(var(--linestrong-l),var(--linestrong-d)) transparent}}
/* Nét nối của cây: trộn màu nhấn với viền, tự sáng/tối theo token. */
#ln{--rail:color-mix(in oklab,var(--accent) 24%,var(--line-strong));
  /* chữ trên nền đặc: nền sáng -> trắng, nền tối -> mực tối nhất (light-dark không được lồng nên dùng token thô) */
  --on-solid:light-dark(#fff,var(--paper-d))}
#ln *,#ln *::before,#ln *::after{box-sizing:border-box}
#ln button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#ln :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* Header: thanh kính mờ dính đỉnh, hairline mảnh thay cho viền 2px. */
#ln .ln-top{position:sticky;top:0;z-index:30;
  background:color-mix(in oklab,var(--paper) 82%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);padding:14px 24px 0;display:flex;flex-wrap:wrap;
  gap:12px 24px;align-items:center}
#ln .ln-brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink)}
#ln .ln-brand p{margin:3px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.01em}
#ln .ln-searchbox{position:relative;flex:1 1 260px;max-width:440px}
#ln #ln-q{width:100%;padding:9px 14px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--surface);font:inherit;font-size:14px;box-shadow:var(--sh1);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
#ln #ln-q::placeholder{color:var(--muted)}
#ln #ln-q:hover{border-color:color-mix(in oklab,var(--accent) 35%,var(--line-strong))}
#ln #ln-q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 18%,transparent)}
#ln .ln-qres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh3);overflow:hidden;
  max-height:340px;overflow-y:auto;z-index:40}
#ln .ln-qres button{display:block;width:100%;text-align:left;padding:10px 14px;
  border-bottom:1px solid var(--line);transition:background .15s var(--ease)}
#ln .ln-qres button:last-child{border-bottom:0}
#ln .ln-qres button:hover{background:var(--surface-2)}
#ln .ln-qres b{display:block;font-size:13.5px}
#ln .ln-qres span{font-size:12px;color:var(--muted)}
/* Tabs: pill segment có viên highlight trượt dưới tab đang chọn. */
#ln .ln-tabs{position:relative;display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;
  padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--sh1)}
#ln .ln-tabs::before{content:"";position:absolute;z-index:0;top:4px;bottom:4px;
  left:var(--tb-x,4px);width:var(--tb-w,0px);border-radius:999px;
  background:color-mix(in oklab,var(--accent) 12%,var(--surface));
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 34%,transparent);
  transition:left .38s var(--ease),width .38s var(--ease),opacity .2s;opacity:var(--tb-on,0)}
#ln .ln-tabs button{position:relative;z-index:1;padding:7px 14px;border-radius:999px;font-weight:600;
  font-size:13px;color:var(--muted);letter-spacing:.01em;white-space:nowrap;
  transition:color .25s var(--ease)}
#ln .ln-tabs button:hover{color:var(--ink)}
#ln .ln-tabs button[aria-selected="true"]{color:var(--accent-ink)}
#ln main{padding:24px 24px 0;max-width:1500px;margin:0 auto;animation:ln-in .34s var(--ease) both}
@keyframes ln-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Tiêu đề mục: kiểu display, chữ hoa sát nhau, nét kẻ mảnh tan dần (bỏ nét đứt). */
#ln .ln-h{display:flex;align-items:center;gap:12px;margin:30px 0 12px;font-size:13px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
#ln .ln-h::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--line-strong),transparent)}
#ln .ln-h.red{color:var(--red)}
#ln .ln-h.red::after{background:linear-gradient(90deg,color-mix(in oklab,var(--red) 45%,transparent),transparent)}
#ln .ln-h.green{color:var(--accent-ink)}
#ln .ln-h.green::after{background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 45%,transparent),transparent)}
#ln .ln-lead{margin:4px 0 16px;font-size:14px;color:var(--muted)}
/* Chip: số văn bản/biên bản = mono, tabular figures. */
#ln .chip{display:inline-block;padding:2px 9px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--surface);font:12px/1.5 var(--f-mono);font-variant-numeric:tabular-nums;
  color:var(--muted);white-space:nowrap}
#ln .chip.hl{background:color-mix(in oklab,var(--accent) 12%,var(--surface));
  border-color:color-mix(in oklab,var(--accent) 45%,transparent);color:var(--accent-ink);font-weight:600}
#ln .chip.old{background:var(--surface-2);border-color:var(--line);color:var(--muted);
  text-decoration:line-through}
#ln #ln-askres .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
#ln #ln-askres .chips .chip{white-space:normal;line-height:1.45}
/* Thẻ nội dung: hairline + bóng lớp, hover nổi 2px. */
#ln .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;
  box-shadow:var(--sh1);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
#ln .card.tint{background:color-mix(in oklab,var(--c,#90a4ae) 7%,var(--surface))}
#ln .chaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
#ln .chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px;
  text-align:left;width:100%;box-shadow:var(--sh1);transition:transform .2s var(--ease),border-color .2s var(--ease)}
#ln .chap:hover{border-color:color-mix(in oklab,var(--blue) 45%,var(--line));transform:translateY(-2px)}
#ln .chap b{display:block;font-size:13px;color:var(--blue)}
#ln .chap span{display:block;font-size:12px;color:var(--ink);margin:3px 0 5px}
#ln .chap .chip{font-size:10.5px;padding:1px 7px;background:color-mix(in oklab,var(--amber) 14%,var(--surface));
  border-color:color-mix(in oklab,var(--amber) 40%,transparent);color:var(--amber)}
#ln .kids{display:grid;gap:6px}
#ln .kid{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r1);padding:9px 12px;box-shadow:var(--sh1);
  transition:transform .2s var(--ease),border-color .2s var(--ease)}
#ln .kid:hover{border-color:color-mix(in oklab,var(--c) 50%,var(--line));transform:translateY(-1px)}
#ln .kid b{font-size:13px;color:var(--c);font-family:var(--f-mono)}
#ln .kid i{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px}
#ln .kid span{display:block;font-size:12px;color:var(--ink)}
#ln .kid mark{background:color-mix(in oklab,var(--accent) 20%,var(--surface));color:var(--ink);
  border-radius:3px;padding:0 2px}
#ln .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
#ln .rel{cursor:pointer;text-align:left;width:100%}
#ln .rel:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
#ln .rel header{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#ln .rel b{font-size:14px;color:var(--c);font-family:var(--f-mono)}
#ln .rel p{margin:6px 0 0;font-size:12.5px}
#ln .rel p mark{background:color-mix(in oklab,var(--accent) 20%,var(--surface));color:var(--ink);
  border-radius:3px;padding:0 2px}
/* ============================================================
   CÂY QUAN HỆ (tab Bản đồ): ô gốc đỉnh, bus + nhánh khuỷu xuống
   hàng ô con, ô cháu treo dọc. Nét nối 1,5px màu --rail.
   ============================================================ */
#ln .tree{list-style:none;margin:0;padding:0}
#ln figure.orgf{margin:0 0 22px}
#ln .orgcap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted);margin:0 0 8px}
#ln .orgcap b{font-size:14px;color:var(--c,var(--ink));font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#ln .orgfit{margin-inline-start:auto;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;min-block-size:26px;box-shadow:var(--sh1);
  transition:color .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease)}
#ln .orgfit:hover{color:var(--ink);border-color:var(--line-strong)}
#ln .orgfit[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
#ln .orgfit:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#ln .orgfit[hidden]{display:none}
#ln .orghint{flex:1 1 100%;font-size:11.5px;color:var(--muted)}
#ln .orgscroll{overflow-x:auto;overscroll-behavior-x:contain;padding-block:2px 10px;scrollbar-width:thin}
#ln .orgscroll>.org{inline-size:max-content;margin-inline:auto}
#ln .orgscroll.flat>.org{inline-size:auto}
/* Mọi hàng/cột của cây tự tính bề rộng theo nội dung — khung không co nó lại. */
#ln .orgscroll .tree{inline-size:max-content;margin-inline:auto;position:relative}
/* Cấp 1: hàng ngang — thanh bus + nhánh rủ từ ô cha xuống từng ô con. */
#ln .orgscroll .tree.row{display:flex;justify-content:safe center;align-items:flex-start;padding-block-start:26px}
#ln .orgscroll .tree.row.flat{flex-wrap:wrap;row-gap:12px;padding-block-start:0;inline-size:auto}
#ln .orgscroll .tree.row[role="group"]::before{content:"";position:absolute;inset-block-start:0;inset-inline-start:50%;
  block-size:26px;border-inline-start:1.5px solid var(--rail)}
#ln .orgscroll .tree.row>.tli{display:flex;flex-direction:column;align-items:center;flex:0 0 max-content;
  position:relative;padding-block-start:26px;padding-inline:5px}
#ln .orgscroll .tree.row>.tli.tkid{padding-block-start:0}
#ln .orgscroll .tree.row>.tli.tkid::before,#ln .orgscroll .tree.row>.tli.tkid::after{content:"";position:absolute;
  inset-block-start:0;block-size:26px;inline-size:50%;border-block-start:1.5px solid var(--rail)}
#ln .orgscroll .tree.row>.tli.tkid::before{inset-inline-end:50%}
#ln .orgscroll .tree.row>.tli.tkid::after{inset-inline-start:50%;border-inline-start:1.5px solid var(--rail)}
#ln .orgscroll .tree.row>.tli.tkid:first-child::before{border-block-start:0}
#ln .orgscroll .tree.row>.tli.tkid:first-child::after{border-start-start-radius:10px}
#ln .orgscroll .tree.row>.tli.tkid:last-child::after{border-block-start:0;border-inline-start:0}
#ln .orgscroll .tree.row>.tli.tkid:last-child::before{border-inline-end:1.5px solid var(--rail);border-start-end-radius:10px}
#ln .orgscroll .tree.row>.tli.tkid:only-child::before{display:none}
#ln .orgscroll .tree.row>.tli.tkid:only-child::after{border-block-start:0;inline-size:0}
#ln .orgscroll .tree.row>.tli.tkid>.tnode::before{content:"";position:absolute;inset-block-start:-11px;inset-inline-start:50%;
  inline-size:8px;block-size:8px;border-block-end:1.5px solid var(--rail);border-inline-end:1.5px solid var(--rail);
  transform:translateX(-50%) rotate(45deg)}
/* Cấp >=2: cột dọc treo dưới ô cha — ray trái, mỗi ô một nhánh rủ. */
#ln .orgscroll .tree.stack{display:block;padding-block-start:0}
#ln .orgscroll .tree.stack::after{content:"";position:absolute;inset-block-start:0;inset-inline-start:0;
  inline-size:calc(50% + 9px);block-size:16px;border-block-end:1.5px solid var(--rail);border-inline-end:1.5px solid var(--rail)}
#ln .orgscroll .tree.stack>.tli{position:relative;padding-inline-start:18px;margin-block-start:9px}
#ln .orgscroll .tree.stack>.tli::after{content:"";position:absolute;inset-block-start:-9px;block-size:24px;
  inset-inline-start:0;border-inline-start:1.5px solid var(--rail)}
#ln .orgscroll .tree.stack>.tli::before{content:"";position:absolute;inset-block-start:15px;inset-inline-start:0;
  inline-size:18px;block-size:0;border-block-start:1.5px solid var(--rail)}
#ln .orgscroll .tree.stack>.tli:first-child::after{inset-block-start:16px;block-size:8px}
/* Ô văn bản trong cây: nền tint từ màu nhóm, hairline đậm dần theo vai. */
#ln .tnode{background:color-mix(in oklab,var(--c,#90a4ae) 6%,var(--surface));
  border:1px solid color-mix(in oklab,var(--c,#90a4ae) 42%,var(--line));border-radius:var(--r2);
  padding:11px 12px 12px;box-shadow:var(--sh1);inline-size:182px;min-inline-size:0;position:relative;text-align:start;

// ── Cây quan hệ: văn bản gốc → văn bản hướng dẫn ─────────────────────────────
var TRANK={"Luật":0,"Bộ luật":0,"Nghị định":1,"Thông tư":2,"Quyết định":3,"Văn bản hợp nhất":4};
function rank(id){var r=TRANK[D(id).type];return r==null?9:r;}
function isLaw(id){var t=D(id).type;return t==="Luật"||t==="Bộ luật";}
function isSide(id){var g=D(id).g;return g==="xuphat"||g==="lq";}
function sortDocs(a,b){return rank(a)-rank(b)||String(D(a).issued||"").localeCompare(String(D(b).issued||""))||code(a).localeCompare(code(b));}
// Văn bản khác được chính mô tả của id dẫn chiếu bằng số (vd "quy định chi tiết NĐ 123/2020").
function citedBy(id){
  var x=D(id);
  var txt=[x.sum,x.kw,(x.bullets||[]).join(" "),(x.chips||[]).join(" ")].filter(Boolean).join(" . ");
  var nums=[],re=/(?:luật|nghị định|bộ luật|nđ|nd|tt|qd)\s*(\d{1,3}\/\d{4})/gi,mm;
  while((mm=re.exec(txt)))nums.push(mm[1]);
  if(!nums.length)return [];
  return Object.keys(DATA.docs).filter(function(k){
    if(k===id)return false;
    var c=String(DATA.docs[k].code||"");
    return nums.some(function(n){return c.indexOf(n)>=0;});
  });
}
// Mỗi văn bản một cha, xét theo thứ tự tín hiệu đáng tin nhất → kém tin nhất.
function treeRel(){
  var ids=Object.keys(DATA.docs);
  var laws=ids.filter(function(k){return isLaw(k)&&!D(k).old;});
  var hlLaw=laws.filter(function(k){return D(k).hl;});
  var par={},why={};
  function put(id,p,w){if(p&&p!==id&&D(id)&&D(p)&&!par[id]){par[id]=p;why[id]=w;}}
  ids.forEach(function(id){
    var x=D(id);
    if(isSide(id))return;                                   // xử phạt / liên quan: dựng thành nhánh riêng
    if(x.parent&&D(x.parent)){put(id,x.parent,"biên soạn khai báo đây là văn bản con");return;}
    if(x.old){
      var nw=(x.replacedBy||[]).concat((DATA.pairs||[]).filter(function(p){return p.old===id;}).map(function(p){return p.nw;}))
        .filter(function(k){return D(k)&&!D(k).old;})[0];
      if(nw)put(id,nw,"đây là bản cũ, văn bản cha đã thay thế nó");
      if(par[id])return;
    }
    var am=(x.amends||[]).filter(function(k){return D(k)&&!D(k).old;});
    if(am.length===1){put(id,am[0],"nó sửa đổi trực tiếp văn bản cha");return;}
    var lg=ids.filter(function(k){return k!==id&&D(k).g===x.g&&isLaw(k)&&!D(k).old;})
      .sort(function(a,b){return String(D(a).issued||"").localeCompare(String(D(b).issued||""));})[0];
    if(lg){put(id,lg,"cùng nhóm chủ đề với luật cha");return;}
    if(D(x.g)&&x.g!==id&&!D(x.g).old){put(id,x.g,"thuộc nhóm hướng dẫn của văn bản cha");return;}
    var ct=citedBy(id).filter(function(k){return !D(k).old&&rank(k)<rank(id);});
    if(ct.length===1){put(id,ct[0],"mô tả của nó dẫn chiếu "+code(ct[0]));return;}
    if(laws.length===1&&id!==laws[0]){put(id,laws[0],"bộ chỉ có một văn bản khung");return;}
    if(hlLaw.length===1&&id!==hlLaw[0])put(id,hlLaw[0],"văn bản cha là luật khung khai báo của bộ");
  });
  ids.forEach(function(id){                                 // cắt vòng: văn bản trong vòng lặp thành node gốc
    var seen={},cur=id;
    while(par[cur]){if(seen[par[cur]]){delete par[id];delete why[id];break;}seen[par[cur]]=1;cur=par[cur];}
  });
  var kids={};
  ids.forEach(function(id){var p=par[id];if(p)(kids[p]=kids[p]||[]).push(id);});
  Object.keys(kids).forEach(function(p){kids[p].sort(sortDocs);});
  return {par:par,why:why,kids:kids};
}
function kidsVis(id,TR){
  return (TR.kids[id]||[]).filter(function(k){
    return (TR.showOld||!D(k).old)&&(!TR.only||TR.only[k]);});
}
function subCount(id,TR){
  var n=1;
  kidsVis(id,TR).forEach(function(k){n+=subCount(k,TR);});
  return n;
}
// Đánh số ô theo từng hàng (nghị định 1..n, thông tư tiếp n+1..) như sơ đồ giấy.
function bfsNums(rootId,TR){
  var nums={},i=0,cur=kidsVis(rootId,TR);
  while(cur.length){
    var next=[];
    cur.forEach(function(id){if(nums[id]==null)nums[id]=++i;next=next.concat(kidsVis(id,TR));});
    cur=next;
  }
  return nums;
}
function treeNode(id,TR,depth,nums){
  var x=D(id),kids=kidsVis(id,TR);
  var meta=[G(id).label,x.issued?"ban hành "+x.issued:"",x.eff?(x.old?"từng hiệu lực ":"hiệu lực ")+x.eff:""]
    .filter(Boolean).join(" · ");
  var cls=(x.old?" isold":"")+(depth?"":" root")+(TR.only&&!TR.hits[id]?" ctx":"")+(TR.only&&TR.hits[id]?" hit":"");
  var h='<li class="tli'+(depth?" tkid":"")+'">'+
    '<div class="tnode'+cls+'" id="tn-'+id+'" style="'+st(id)+'">'+
      '<button type="button" class="tbody" data-doc="'+id+'">'+
        (depth?'<span class="tnum" aria-hidden="true">'+(nums[id]||"")+"</span>":"")+
        '<span class="ttype">'+esc(x.type||"Văn bản")+"</span>"+
        '<b class="tcode">'+code(id)+"</b>"+
        '<span class="tmeta">'+esc(meta)+"</span>"+
        '<span class="tsum">'+esc(x.sum||"")+"</span>"+
      "</button>"+
      (depth?'<span class="trel">vì '+esc(TR.why[id]||"")+"</span>":"")+
      (depth&&!kids.length&&!x.old&&!TR.only?'<span class="tnone">chưa có văn bản hướng dẫn trực tiếp</span>':"")+
    "</div>";
  var fix=(x.amendedBy||[]).filter(function(k){return D(k)&&kids.indexOf(k)<0;});   // bản sửa đã là node con thì khỏi lặp
  if(!x.old&&fix.length)h+='<div class="tfix">được sửa đổi bởi '+
    fix.map(function(k){return '<button type="button" data-doc="'+k+'">'+code(k)+"</button>";}).join("")+"</div>";
  if(kids.length)h+='<ul role="group" aria-labelledby="tn-'+id+'" class="tree '+(depth?"stack":"row")+'">'+
    kids.map(function(k){return treeNode(k,TR,depth+1,nums);}).join("")+"</ul>";
  return h+"</li>";
}
function orgFigure(rootId,TR){
  var x=D(rootId),kids=kidsVis(rootId,TR),total=subCount(rootId,TR);
  return '<figure class="orgf">'+
    '<figcaption class="orgcap" style="'+st(rootId)+'"><b>'+code(rootId)+"</b>"+
      "<span>"+esc(G(rootId).label||"")+" · "+total+" văn bản trong sơ đồ</span>"+
      '<button type="button" class="orgfit" data-fit hidden aria-pressed="false">Vừa khung</button></figcaption>'+
    '<div class="orgscroll"><div class="org"><ul role="list" class="tree row">'+
      treeNode(rootId,TR,0,bfsNums(rootId,TR))+
    "</ul></div></div></figure>";
}
// Các ô gốc không có con (xử phạt, liên quan): xếp thành hàng ngang, không vẽ đường nối.
function flatFigure(ids,TR,note){
  return '<figure class="orgf">'+
    '<figcaption class="orgcap"><b>'+ids.length+" ô độc lập</b><span>"+esc(note||"chưa có văn bản hướng dẫn kèm theo trong bộ này")+"</span></figcaption>"+
    '<div class="orgscroll flat"><div class="org"><ul role="list" class="tree row flat">'+
      ids.map(function(id){return treeNode(id,TR,0,{});}).join("")+
    "</ul></div></div></figure>";
}
function chapsHtml(rootId,TR){
  var x=D(rootId);
  if(TR.par[rootId]||x.old||!x.chapters)return "";
  return '<h4 class="chaps-h">Các chương của '+code(rootId)+"</h4><div class=\"chaps\">"+
    x.chapters.map(function(ch){
      return '<button type="button" class="chap" data-doc="'+rootId+'"><b>'+esc(ch.t)+"</b><span>"+esc(ch.d)+"</span>"+
        (ch.nd?'<span class="chip">'+esc(ch.nd)+"</span>":"")+"</button>";}).join("")+"</div>";
}
function treeBranch(TR,ids,label,cls){
  var roots=ids.filter(function(id){return !TR.par[id]&&(TR.showOld||!D(id).old);}).sort(sortDocs);
  if(!roots.length)return "";
  var tree=[],flat=[];
  roots.forEach(function(id){(kidsVis(id,TR).length?tree:flat).push(id);});
  var h='<h3 class="ln-h'+cls+'">'+esc(label)+"</h3>";
  tree.forEach(function(id){h+=orgFigure(id,TR)+chapsHtml(id,TR);});
  if(flat.length)h+=flatFigure(flat,TR);
  return h;
}
// Cây thu gọn cho tab "Vấn đề của bạn": chỉ vẽ các văn bản kế hoạch mở + chuỗi văn bản khung của chúng.
function askTreeHtml(r){
  var hits=(r.plan||[]).map(function(x){return x[0];}).filter(function(id){return D(id);});
  if(hits.length<2)return "";
  var TR=treeRel();
  TR.showOld=persona==="chuyensau";
  var keep={},hit={},cur=hits.slice();
  hits.forEach(function(id){hit[id]=1;});
  while(cur.length){
    var id=cur.pop();
    if(keep[id])continue;
    keep[id]=1;
    var par=TR.par[id];
    if(par&&D(par)&&(TR.showOld||!D(par).old))cur.push(par);
  }
  var roots=Object.keys(keep).filter(function(id){return !keep[TR.par[id]];}).sort(sortDocs);
  if(!roots.length)return "";
  TR.only=keep; TR.hits=hit;
  var tree=[],solo=[];
  roots.forEach(function(id){(kidsVis(id,TR).length?tree:solo).push(id);});
  if(tree.length>3)return "";
  var h='<h3 class="ln-h green">Sơ đồ liên quan — đúng các văn bản kế hoạch mở</h3>'+
    '<p class="ln-lead">Vẽ '+Object.keys(hit).length+' văn bản kế hoạch đã chọn ở trên, kèm chuỗi văn bản khung của chúng để nối thành cây. '+
    'Ô nền nhạt = văn bản khung để nối cây, không phải thứ bạn hỏi; đường nối và dòng nghiêng “vì …” giống hệt tab Bản đồ.</p>';
  tree.forEach(function(id){h+=orgFigure(id,TR);});
  if(solo.length)h+=flatFigure(solo,TR,"đứng riêng: kế hoạch không kèm văn bản hướng dẫn của ô này");
  return h;
}
function viewMap(){
  var ids=Object.keys(DATA.docs);
  if(!ids.length)return '<p class="ln-lead">Không có dữ liệu văn bản nào.</p>';
  var TR=treeRel();
  TR.showOld=persona==="chuyensau";
  var h='<h2 class="ln-h">Sơ đồ cây — văn bản gốc ở trên, văn bản hướng dẫn ở dưới</h2>'+
    '<p class="ln-lead">Mỗi sơ đồ đi từ một văn bản khung: hàng dưới là các nghị định quy định chi tiết, hàng cuối là thông tư/quyết định của từng nghị định. '+
    'Bấm vào một ô để mở ghi chú chi tiết; sơ đồ rộng hơn màn hình thì kéo ngang hoặc bấm “Vừa khung”. '+
    'Ô vẽ nét đứt là văn bản hết hiệu lực, nằm ngay dưới văn bản thay thế nó (chế độ “Chuyên sâu”). '+
    'Dòng in nghiêng “vì …” cho biết căn cứ ghép nhánh — quan hệ do máy suy từ dữ liệu đã biên soạn, vẫn phải đối chiếu bản gốc khi trích dẫn.</p>'+
    '<div class="legend"><i>Chữ số = thứ tự ô trong sơ đồ</i><i>Màu = nhóm văn bản</i>'+
      '<i>Nét đứt = hết hiệu lực</i><i>Bấm ô = mở chi tiết</i></div>';
  var main=ids.filter(function(id){return !isSide(id);});
  h+=treeBranch(TR,main,"Luật và văn bản hướng dẫn","", "");

  h+=treeBranch(TR,ids.filter(function(id){return D(id).g==="lq";}),"Văn bản liên quan"," green");

}
// Sơ đồ ngang: hiện nút "Vừa khung" khi cây tràn khung, phóng bằng zoom (kèm co cả layout, hết thanh cuộn).
function initOrgFit(fig){
  var scroll=fig.querySelector(".orgscroll"),org=fig.querySelector(".org"),btn=fig.querySelector("[data-fit]");
  if(!scroll||!org||!btn)return;
  var nat=org.getBoundingClientRect().width,box=scroll.clientWidth;
  if(!(nat>box+8))return;
  btn.hidden=false;
  var ratio=nat/box;
  function setFit(on){
    btn.setAttribute("aria-pressed",on?"true":"false");
    btn.textContent=on?"Kích thước thật":"Vừa khung";
    org.style.zoom=on?String(Math.max(.34,+(box/nat).toFixed(3))):"";
  }
  btn.addEventListener("click",function(){setFit(btn.getAttribute("aria-pressed")!=="true");});
  var fitNow=box/nat>=0.7;
  var cap=fig.querySelector(".orgcap");
  if(cap&&ratio>=1.15)cap.insertAdjacentHTML("beforeend",'<span class="orghint">cây rộng gấp '+
    (Math.round(ratio*10)/10).toFixed(1).replace(".",",")+' lần khung — '+
    (fitNow?'đang thu gọn cho vừa khung — bấm nút “Kích thước thật” để chữ to hơn'
            :'kéo ngang để xem hết, hoặc bấm nút “Vừa khung” để thu gọn')+'</span>');
  // Tự động vừa khung chỉ khi co lại chữ vẫn đọc (≥0,7); tràn nhiều thì giữ kích thật + kéo ngang.
  if(fitNow)setFit(true);
  else scroll.scrollLeft=Math.max(0,(scroll.scrollWidth-scroll.clientWidth)/2);
}

function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/đ/g,"d").replace(/[^a-z0-9\s]/g," ");}
var STOP={};("va cua thi la bi duoc cho voi khi nao gi khong co phai lam the toi minh can muon nen ma van dang da se de tren trong tai ve ra sao nhu the bao nhieu phan tram hoac cung den tu o dau bat dau giup xem biet lien quan he thong van ban phap luat").split(" ").forEach(function(w){STOP[w]=1;});
function concepts(q){
  var seen={},out=[];
  norm(q).split(/\s+/).forEach(function(w){
    if(w.length<4||STOP[w]||seen[w])return;
    seen[w]=1;out.push(w);
  });
  return out;
}
function docHay(id){var d=D(id);
  return norm([d.code,d.sum,(d.bullets||[]).join(" "),(d.kw||""),(d.chips||[]).join(" "),((DATA.groups[d.g]||{}).label||"")].join(" "));}
function wset(s){var o={};norm(s).split(/\s+/).forEach(function(w){if(w)o[w]=1;});return o;}

function analyze(q){
  var cs=concepts(q);
  var says=[],nq=norm(q),drop={},gloss={};
  LEX.forEach(function(e){
    if(e.dom&&e.dom!==(DATA.meta&&DATA.meta.dom))return;
    if(!new RegExp(e.p).test(nq))return;
    if(says.indexOf(e.say)<0)says.push(e.say);
    (e.add||[]).forEach(function(w){if(cs.indexOf(w)<0)cs.push(w);});
    (e.drop||[]).forEach(function(w){drop[w]=1;});
    if(e.gloss)Object.keys(e.gloss).forEach(function(k){gloss[k]=e.gloss[k];});
  });
  cs=cs.filter(function(w){return !drop[w];});
  if(!cs.length)return null;
  var orig={};
  String(q).split(/[\s,.;:!?()\/\-–—]+/).forEach(function(tok){
    var n=norm(tok).trim();
    if(n&&!orig[n])orig[n]=tok.toLowerCase();
  });
  var hay={};
  Object.keys(DATA.docs).forEach(function(id){hay[id]=wset(docHay(id));});
  var df={};
  cs.forEach(function(w){
    df[w]=0;
    Object.keys(hay).forEach(function(id){if(hay[id][w])df[w]++;});
  });
  var total=Object.keys(hay).length;
  function wOf(w){var d=df[w];
    if(!d)return 0;
    if(d<=2)return 2.2;
    if(d<=5)return 1.6;
    if(d<=Math.max(6,Math.round(total*0.18)))return 1;
    return 0.4;}
  var ds={};
  Object.keys(hay).forEach(function(id){
    var s=0,cov=[],kww=wset(D(id).kw||"");
    cs.forEach(function(w){
      if(hay[id][w]){
        var ww=wOf(w);
        s+=ww*(kww[w]?1.4:1);
        cov.push(w);
      }
    });
    ds[id]={s:s,cov:cov};
  });
  var covered={};
  Object.keys(ds).forEach(function(id){ds[id].cov.forEach(function(w){covered[w]=1;});});
  var miss=cs.filter(function(w){return !covered[w];});
  var pct=Math.round((cs.length-miss.length)/cs.length*100);
  var tScore=(DATA.tasks||[]).map(function(t){
    var th=wset(t.label+" "+t.hint+" "+t.docs.map(function(p){return p[1];}).join(" "));
    var s=0;
    cs.forEach(function(w){if(th[w])s+=wOf(w)*1.2;});
    t.docs.forEach(function(p){if(ds[p[0]])s+=ds[p[0]].s*0.5;});
    return {t:t,s:s};
  }).sort(function(a,b){return b.s-a.s;});
  var top=tScore.length&&tScore[0].s>0?tScore[0].t:null;
  var plan=top?top.docs.filter(function(p){return D(p[0]);}):
    Object.keys(ds).filter(function(id){return ds[id].s>0&&!D(id).old;})
      .sort(function(a,b){return ds[b].s-ds[a].s;}).slice(0,4)
      .map(function(id){return [id,"Khớp khái niệm trong mô tả vấn đề của bạn"];});
  var note="",curated=false,resolve=null;
  var bestP=null,bestPScore=0;
  function keyScore(p){
    var best=0;
    (p.keys||[]).forEach(function(k){
      var nk=norm(k).trim();
      if(nk&&nq.indexOf(nk)>=0)best=Math.max(best,nk.split(/\s+/).length);
    });
    return best;
  }
  (DATA.problems||[]).forEach(function(p){
    var ks=keyScore(p),score=0;
    if(ks)score=100+ks;
    else{
      var pc=concepts(p.q);
      if(!pc.length)return;
      var hit=pc.filter(function(w){return cs.indexOf(w)>=0;}).length;
      var qCov=hit/Math.max(1,cs.length);
      var pCov=hit/Math.max(1,pc.length);
      if(hit>=2&&qCov>=0.5)score=qCov*2+pCov+Math.min(hit,6)*0.05;
    }
    if(score>bestPScore){bestPScore=score;bestP=p;}
  });
  if(bestP){
    var pl=(bestP.plan||[]).filter(function(x){return D(x[0]);});
    if(pl.length){plan=pl;curated=true;pct=Math.max(pct,Math.min(100,bestP.cover||pct));}
    if(bestP.note)note=bestP.note;
    if(Array.isArray(bestP.resolve)&&bestP.resolve.length)resolve=bestP.resolve;
  }
  var inPlan={};plan.forEach(function(p){inPlan[p[0]]=1;});
  var best=0;
  plan.forEach(function(p){if(ds[p[0]]&&ds[p[0]].s>best)best=ds[p[0]].s;});
  var planCov={};plan.forEach(function(p){if(ds[p[0]])ds[p[0]].cov.forEach(function(w){if(wOf(w)>=1)planCov[w]=1;});});
  var rel=Object.keys(ds).filter(function(id){
      if(!(ds[id].s>0)||inPlan[id]||D(id).old||ds[id].s<Math.max(1.5,best*0.45))return false;
      return ds[id].cov.some(function(w){return planCov[w];});
    }).sort(function(a,b){return ds[b].s-ds[a].s;}).slice(0,4);
  var tier=pct>=100?"Bám sát trọn vẹn: bộ văn bản phủ đủ mọi khía cạnh nêu trong mô tả.":
    pct>=70?"Bám sát: bộ văn bản này dẫn được gần trọn vấn đề của bạn.":
    pct>=40?"Định hướng phần lớn: còn khía cạnh nằm ngoài bộ văn bản hiện có.":
    pct>0?"Chỉ gợi điểm khởi đầu: câu mô tả còn chung chung — thêm chi tiết đời thường (việc gì, giấy tờ gì, ai liên quan, lúc nào) để hệ thống dịch sát hơn.":
    "Chưa khớp: bộ văn bản chưa có nội dung cho mô tả này.";
  return {pct:pct,tier:tier,covN:cs.length-miss.length,csN:cs.length,
    plan:plan,rel:rel,miss:miss.slice(0,4),note:note,curated:curated,orig:orig,says:says,gloss:gloss,resolve:resolve};
}

function routeHint(q,pct){
  var box=document.getElementById("ln-askroute");
  if(!box)return;
  box.innerHTML="";
  var m=location.pathname.match(/\/api\/sets\/([^/]+)\/map/);
  if(!m||typeof fetch!=="function"||!q)return;
  fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:q})})
    .then(function(r){return r.json();})
    .then(function(res){
      var b=document.getElementById("ln-askroute");
      if(!b||state.askq!==q)return;
      var top=(res.results||[])[0];
      if(!top||top.id===m[1]||top.pct<60||top.pct<=pct)return;
      b.innerHTML='<div class="ln-route"><span><b>Câu này thuộc bộ khác trong thư viện:</b> «'+esc(top.name)+'» phủ '+top.pct+'% điều bạn mô tả — bộ hiện tại chỉ phủ '+pct+'%.</span>'+
        '<a class="askgo" href="/api/sets/'+encodeURIComponent(top.id)+'/map?q='+encodeURIComponent(q)+'">Mở bộ đó kèm câu hỏi →</a></div>';
    }).catch(function(){});
}

function viewAsk(){
  return '<p class="ln-lead">Kể vấn đề bằng lời thường, như nhắn cho đồng nghiệp — không cần từ chuyên ngành. Hệ thống tự dịch sang khái niệm văn bản, chỉ điểm bắt đầu, chuỗi văn bản liên quan và ước lượng phần trăm vấn đề có thể dẫn dắt được.</p>'+
    '<div class="askbox"><textarea id="ln-askq" placeholder="Ví dụ: hóa đơn điện tử lập sai thuế suất, khách yêu cầu hủy và lập lại thì bắt đầu từ đâu?"></textarea>'+
    '<div class="askbar"><button class="askgo" id="ln-askgo">Phân tích vấn đề</button>'+
    ((DATA.problems||[]).length?'<span class="chip">thử nhanh:</span>'+DATA.problems.map(function(p,i){
      return '<button class="asksample" data-aski="'+i+'">'+esc(p.q.length>56?p.q.slice(0,56)+"…":p.q)+"</button>";}).join(""):"")+
    "</div></div>"+
    '<div id="ln-askres"></div>';
}

function render(){
  qres.hidden=true;
  var h={map:viewMap,ask:viewAsk,old:viewOld,task:viewTask,time:viewTime,path:viewPath}[state.view]();
  if(state.view==="map"&&!hintSeen){
    h='<div class="ln-hint"><span>Mới lần đầu? Kể vấn đề bằng lời thường ở tab <b>Vấn đề của bạn</b>, hoặc đi từng bước ở <b>Học từng bước</b>. Chọn vai trò «Bạn là» phía trên để lọc nội dung cho đúng nhu cầu.</span><button data-hintx aria-label="Ẩn gợi ý">&times;</button></div>'+h;
  }
  main.innerHTML=h;
  if(state.view==="map"){
    Array.prototype.forEach.call(main.querySelectorAll(".orgf"),initOrgFit);
  }
  if(state.view==="ask"){
    document.getElementById("ln-askgo").addEventListener("click",runAsk);
    document.getElementById("ln-askq").addEventListener("keydown",function(e){
      if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))runAsk();});
    if(state.askq){document.getElementById("ln-askq").value=state.askq;runAsk();}
  }
  if(state.view==="old"){
    document.getElementById("ln-oldsel").addEventListener("change",function(){
      var box=document.getElementById("ln-oldres");
      if(!this.value){box.innerHTML="";return;}
      var p=DATA.pairs.filter(function(x){return x.old===this.value&&D(x.old)&&D(x.nw);},this)[0];
      box.innerHTML='<h3 class="ln-h green">Mở bản mới thay thế</h3><div class="pairs">'+pairHtml(p)+"</div>";
    });
  }
  if(state.view==="task"&&state.task){
    document.getElementById("ln-tres").innerHTML=taskResult(state.task);
  }
}

function openDoc(id){
  var d=D(id);if(!d)return;
  var g=G(id);
  var h='<div class="d-code" style="'+st(id)+'">'+code(id)+"</div>"+
    '<div class="d-type">'+esc(d.type)+" · nhóm: "+esc(g.label||"—")+(d.old?" · <b>hết hiệu lực</b>":"")+"</div>";
  if(d.url)h+='<p class="d-sec">Nguồn chính thống</p><div class="d-links"><a class="chip" href="'+esc(d.url)+'" target="_blank" rel="noopener">Toàn văn / bản gốc ↗</a></div>';
  h+='<p class="d-sec">Nội dung</p><p class="d-body">'+esc(d.sum)+"</p>";
  if(d.bullets)h+='<ul class="d-body">'+d.bullets.map(function(b){return "<li>"+esc(b)+"</li>";}).join("")+"</ul>";
  if(d.chips)h+='<p class="d-sec">Mốc</p><div class="d-links">'+d.chips.map(function(c){return '<span class="chip">'+esc(c)+"</span>";}).join("")+"</div>";
  if(d.issued)h+='<p class="d-sec">Ban hành</p><p class="d-body">'+esc(d.issued)+"</p>";
  if(d.eff)h+='<p class="d-sec">Hiệu lực</p><p class="d-body">'+esc(d.eff)+"</p>";
  if(d.replaces&&d.replaces.length){
    h+='<p class="d-sec">Thay thế</p><div class="d-links">'+d.replaces.filter(function(r){return D(r);}).map(function(r){
      return '<button class="oldlink" data-doc="'+r+'">'+code(r)+"</button>";}).join("")+"</div>";}
  if(d.replacedBy&&d.replacedBy.length){
    h+='<p class="d-sec">Được thay bởi</p><div class="d-links">'+d.replacedBy.filter(function(r){return D(r);}).map(function(r){
      return '<button data-doc="'+r+'" style="'+st(r)+'">'+code(r)+"</button>";}).join("")+"</div>";}
  if(d.basis&&D(d.basis)){
    h+='<p class="d-sec">Căn cứ pháp lý</p><div class="d-links"><button data-doc="'+d.basis+'" style="'+st(d.basis)+'">'+code(d.basis)+"</button></div>";}
  if(d.amends&&d.amends.length){
    h+='<p class="d-sec">Sửa đổi, bổ sung</p><div class="d-links">'+d.amends.filter(function(r){return D(r);}).map(function(r){
      return '<button data-doc="'+r+'" style="'+st(r)+'">'+code(r)+"</button>";}).join("")+"</div>";}
  if(d.amendedBy&&d.amendedBy.length){
    h+='<p class="d-sec">Được sửa đổi bởi</p><div class="d-links">'+d.amendedBy.filter(function(r){return D(r);}).map(function(r){
      return '<button data-doc="'+r+'" style="'+st(r)+'">'+code(r)+"</button>";}).join("")+"</div>";}
  var kids=Object.keys(DATA.docs).filter(function(k){var x=D(k);return x.g===d.g&&k!==id&&!x.old&&x.type!=="Luật"&&d.type==="Nghị định";});
  if(kids.length)h+='<p class="d-sec">Văn bản đi kèm</p><div class="d-links">'+kids.map(function(k){
    return '<button data-doc="'+k+'" style="'+st(k)+'">'+code(k)+"</button>";}).join("")+"</div>";
  var inTasks=DATA.tasks.filter(function(t){return t.docs.some(function(p){return p[0]===id;});});
  if(inTasks.length)h+='<p class="d-sec">Dùng cho việc</p><div class="d-links">'+inTasks.map(function(t){
    return '<button data-gotask="'+t.id+'">'+esc(t.label)+"</button>";}).join("")+"</div>";
  var rp=(DATA.readingPath||[]).findIndex(function(s){return s.doc===id;});
  if(rp>=0)h+='<p class="d-sec">Lộ trình đọc</p><p class="d-body">Bước '+(rp+1)+" / "+DATA.readingPath.length+" — "+esc(DATA.readingPath[rp].why)+"</p>";
  var ti=tourSteps().findIndex(function(s){return (s.docs||[]).indexOf(id)>=0;});
  if(ti>=0)h+='<p class="d-sec">Trong lộ trình học</p><p class="d-body">Bước '+(ti+1)+": "+esc(tourSteps()[ti].title)+' — <button class="ln-tourexit" data-tourjump="'+ti+'">mở bước này</button></p>';
  dbody.innerHTML=h;
  drawer.hidden=false;
}
function closeDrawer(){drawer.hidden=true;}
document.getElementById("ln-x").addEventListener("click",closeDrawer);

root.addEventListener("click",function(e){
  var doc=e.target.closest("[data-doc]");
  if(doc){openDoc(doc.dataset.doc);closeModals();return;}
  if(e.target.closest("[data-hintx]")){hintSeen=true;try{localStorage.setItem("ln-hint","1");}catch(err){}render();return;}
  if(e.target.closest("[data-tourstart]")){state.tour=0;state.tourDone=false;render();return;}
  var tg=e.target.closest("[data-tourgo],[data-tourjump],[data-tourdot]");
  if(tg){state.view="path";state.tour=+(tg.dataset.tourgo||tg.dataset.tourjump||tg.dataset.tourdot);state.tourDone=false;syncTabs();closeDrawer();render();return;}
  if(e.target.closest("[data-tourexit]")){state.tour=-1;render();return;}
  if(e.target.closest("[data-tourprev]")){if(state.tour>0)state.tour--;render();return;}
  if(e.target.closest("[data-tournext]")){
    if(state.tour>=tourSteps().length-1){state.tour=-1;state.tourDone=true;}else state.tour++;
    render();return;}
  var t=e.target.closest("[data-task]");
  if(t){state.task=t.dataset.task;
    main.querySelectorAll(".tbtn").forEach(function(b){b.setAttribute("aria-pressed",b===t);});
    document.getElementById("ln-tres").innerHTML=taskResult(state.task);
    return;}
  var gt=e.target.closest("[data-gotask]");
  if(gt){state.view="task";state.task=gt.dataset.gotask;
    syncTabs();render();closeDrawer();return;}
  var ai=e.target.closest("[data-aski]");
  if(ai){var p=(DATA.problems||[])[+ai.dataset.aski];
    if(p){state.askq=p.q;render();}
    return;}
  if(!e.target.closest(".ln-drawer")&&!e.target.closest(".ln-searchbox")&&!e.target.closest(".ln-modal"))closeDrawer();
});

function searchList(term){
  term=term.trim().toLowerCase();
  if(term.length<2)return [];
  return Object.keys(DATA.docs).filter(function(id){var d=D(id);
    if(persona==="nguoidan"&&d.old)return false;
    return (d.code+" "+d.sum+" "+(d.kw||"")).toLowerCase().indexOf(term)>=0;
  }).slice(0,9);
}
q.addEventListener("input",function(){
  var list=searchList(q.value);
  if(!list.length){qres.hidden=true;return;}
  qres.hidden=false;
  qres.innerHTML=list.map(function(id){var d=D(id);
    return '<button data-doc="'+id+'"><b>'+code(id)+(d.old?" (hết hiệu lực)":"")+"</b><span>"+esc(d.sum)+"</span></button>";}).join("");
});
q.addEventListener("keydown",function(e){
  if(e.key==="Enter"){var list=searchList(q.value);if(list.length){openDoc(list[0]);qres.hidden=true;}}
  if(e.key==="Escape"){qres.hidden=true;q.blur();}
});
var pathModal=document.getElementById("ln-pathmodal");
var helpModal=document.getElementById("ln-helpmodal");
function closeModals(){pathModal.hidden=true;helpModal.hidden=true;}
function relEdges(){
  var E=[],seen={};
  function add(a,b,label){
    if(!a||!b||a===b||!D(a)||!D(b))return;
    var k=a<b?a+"|"+b:b+"|"+a;
    if(seen[k])return;seen[k]=1;
    E.push([a,b,label]);
  }
  Object.keys(DATA.docs).forEach(function(id){var d=D(id);
    if(d.basis)add(id,d.basis,"căn cứ pháp lý");
    (d.amends||[]).forEach(function(t){add(id,t,"sửa đổi, bổ sung");});
    (d.replaces||[]).forEach(function(t){add(id,t,"thay thế");});
  });
  (DATA.pairs||[]).forEach(function(p){add(p.nw,p.old,"thay thế");});
  Object.keys(DATA.groups).forEach(function(g){
    if(g==="cu"||g==="lq")return;
    var mem=Object.keys(DATA.docs).filter(function(k){return D(k).g===g&&!D(k).old;});
    if(mem.length<2)return;
    var head=mem.filter(function(k){return D(k).type==="Luật";})[0]||mem.filter(function(k){return k===g;})[0]||mem[0];
    mem.forEach(function(k){if(k!==head)add(head,k,"cùng nhóm hướng dẫn");});
  });
  return E;
}
function findPath(a,b){
  var adj={};
  relEdges().forEach(function(e){
    (adj[e[0]]=adj[e[0]]||[]).push([e[1],e[2]]);
    (adj[e[1]]=adj[e[1]]||[]).push([e[0],e[2]]);
  });
  var prev={},seen={};seen[a]=1;
  var queue=[a];
  while(queue.length){
    var u=queue.shift();
    if(u===b)break;
    (adj[u]||[]).forEach(function(ed){
      if(!seen[ed[0]]){seen[ed[0]]=1;prev[ed[0]]=[u,ed[1]];queue.push(ed[0]);}
    });
  }
  if(!seen[b])return null;
  var path=[],cur=b;
  while(cur!==a){path.unshift({id:cur,rel:prev[cur][1]});cur=prev[cur][0];}
  path.unshift({id:a,rel:null});
  return path;
}
function fillPick(sel){
  var ids=Object.keys(DATA.docs).sort(function(x,y){return (D(x).old?1:0)-(D(y).old?1:0);});
  sel.innerHTML='<option value="">— chọn văn bản —</option>'+ids.map(function(id){
    return '<option value="'+id+'">'+code(id)+(D(id).old?" (hết hiệu lực)":"")+"</option>";}).join("");
}
document.getElementById("ln-pathbtn").addEventListener("click",function(){
  fillPick(document.getElementById("ln-pfrom"));
  fillPick(document.getElementById("ln-pto"));
  document.getElementById("ln-pres").innerHTML="";
  pathModal.hidden=false;
});
document.getElementById("ln-pgo").addEventListener("click",function(){
  var a=document.getElementById("ln-pfrom").value,b=document.getElementById("ln-pto").value;
  var box=document.getElementById("ln-pres");
  if(!a||!b){box.innerHTML='<p class="ln-lead">Chọn đủ hai văn bản đã.</p>';return;}
  if(a===b){box.innerHTML='<p class="ln-lead">Hai lựa chọn trùng nhau — chọn văn bản thứ hai khác văn bản đầu.</p>';return;}
  var p=findPath(a,b);
  if(!p){box.innerHTML='<p class="ln-lead">Không có chuỗi quan hệ nối hai văn bản này trong bộ hiện tại. Thử đi qua văn bản khung (luật gốc hoặc nghị định hướng dẫn chung của nhóm).</p>';return;}
  box.innerHTML='<p class="ln-lead"><b>Chuỗi '+p.length+" văn bản</b> — bấm từng thẻ để mở chi tiết:</p>"+
    '<div class="ln-chain">'+p.map(function(step,i){
      var s=D(step.id).sum;
      return (i?'<div class="ln-edge">'+esc(step.rel)+"</div>":"")+
        '<button class="pnode" data-doc="'+step.id+'" style="'+st(step.id)+'"><span class="n">'+(i+1)+"</span><span><b>"+code(step.id)+"</b><i>"+esc(s.length>90?s.slice(0,90)+"…":s)+"</i></span></button>";
    }).join("")+"</div>";
});
function openHelp(){
  document.getElementById("ln-keys").innerHTML=[
    ["/","Nhảy vào ô tìm kiếm"],
    ["1–"+visViews.length,"Chuyển tab: "+visViews.map(function(v,i){return (i+1)+"="+v[1];}).join(", ")],
    ["?","Mở / đóng bảng phím tắt này"],
    ["Esc","Đóng khung chi tiết và các hộp thoại"],
    ["Ctrl/⌘+Enter","Trong ô vấn đề: phân tích ngay"]
  ].map(function(k){return "<li><kbd>"+esc(k[0])+"</kbd><span>"+esc(k[1])+"</span></li>";}).join("");
  helpModal.hidden=false;
}
/* Nút đổi nền: hai trạng thái — theo hệ thống, hoặc ghim ngược lại với những gì đang hiển thị.
   Màu do CSS lo (light-dark + <meta>); JS chỉ ghi giá trị và nhãn, không dùng matchMedia để xoá bản lưu. */
var themeBtn=document.getElementById("ln-theme");
var SYS=matchMedia("(prefers-color-scheme:dark)");
function metaCS(){return document.querySelector('meta[name="color-scheme"]');}
function storedCS(){try{return localStorage.getItem("ln-color-scheme");}catch(e){return null;}}
function sysCS(){return SYS.matches?"dark":"light";}
function shownCS(){var s=storedCS();return (s==="light"||s==="dark")?s:sysCS();}
function paintTheme(){
  if(!themeBtn)return;
  var cur=shownCS(),other=cur==="dark"?"light":"dark";
  themeBtn.innerHTML=(cur==="dark"?"\u2600":"\u263e")+
    '<span class="ln-sr">Chuyển sang nền '+(other==="dark"?"tối":"sáng")+"</span>";
  themeBtn.title="Đang là nền "+(cur==="dark"?"tối":"sáng")+" — bấm để đổi";
}
function applyTheme(){
  var m=metaCS();
  if(m)m.content=storedCS()||"light dark";
  paintTheme();
}
if(themeBtn){
  paintTheme();
  themeBtn.addEventListener("click",function(){
    var target=shownCS()==="dark"?"light":"dark";
    try{if(target===sysCS())localStorage.removeItem("ln-color-scheme");
        else localStorage.setItem("ln-color-scheme",target);}catch(e){}
    applyTheme();
  });
  if(SYS.addEventListener)SYS.addEventListener("change",paintTheme);
  addEventListener("storage",function(e){if(e.key==="ln-color-scheme")applyTheme();});
}
document.getElementById("ln-helpbtn").addEventListener("click",function(){helpModal.hidden?openHelp():closeModals();});
[pathModal,helpModal].forEach(function(m){
  m.addEventListener("click",function(e){if(e.target===m||e.target.closest("[data-closemodal]"))closeModals();});
});
document.addEventListener("keydown",function(e){
  var el=document.activeElement,tag=el?el.tagName:"";
  var typing=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";
  if(e.key==="Escape"){closeModals();closeDrawer();qres.hidden=true;return;}
  if(typing)return;
  if(e.key==="/"){e.preventDefault();q.focus();return;}
  if(e.key==="?"){helpModal.hidden?openHelp():closeModals();return;}
  var n=parseInt(e.key,10);
  if(n>=1&&n<=visViews.length){state.view=visViews[n-1][0];syncTabs();render();}
});

render();
})();
